{% load i18n %}
{% if form.non_field_errors %}
  <div class="form-errors" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="form-field">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if not field.field.required %} <span class="field-optional">({% translate "optional" %})</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div id="{{ field.auto_id }}_helptext" class="form-text">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}
      <div id="{{ field.auto_id }}_error" class="invalid-feedback">
        {% for error in field.errors %}<div>{{ error }}</div>{% endfor %}
      </div>
    {% endif %}
  </div>
{% endfor %}
